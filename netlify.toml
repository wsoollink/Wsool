# Netlify's Next.js adapter, pinned so it always runs (without it Netlify
# serves the folder as a static site and every page is a 404).
[build]
  # Applies pending Prisma migrations to Supabase, then builds.
  command = "npm run build:deploy"
  publish = ".next"
  # Skip the deploy (and its credits) when only the mobile app or docs changed.
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- . ':(exclude)mobile' ':(exclude)docs'"

[build.environment]
  NODE_VERSION = "22"

[[plugins]]
  package = "@netlify/plugin-nextjs"

# The newsletter's heading font is loaded by mail apps and the editor preview from other origins
# (fonts need CORS). Netlify serves public/ files itself, so next.config.ts headers don't reach them.
[[headers]]
  for = "/brand/fonts/*"
  [headers.values]
    Access-Control-Allow-Origin = "*"
    Cache-Control = "public, max-age=31536000, immutable"
