name: Mobile build

# Builds the Expo app in mobile/ on Expo's servers (EAS Build). Run by hand from
# GitHub → Actions → "Mobile build" → Run workflow. Needs the EXPO_TOKEN
# repository secret (an Expo access token; never in code or chat).
on:
  workflow_dispatch:
    inputs:
      platform:
        description: "android / ios / all"
        required: true
        default: android
        type: choice
        options: [android, ios, all]
      profile:
        description: "preview = test copy for your phone, production = store"
        required: true
        default: preview
        type: choice
        options: [preview, production]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - run: npm ci
      # --no-wait: the build runs on Expo; its link appears in this log and on expo.dev.
      - run: eas build --platform ${{ inputs.platform }} --profile ${{ inputs.profile }} --non-interactive --no-wait
