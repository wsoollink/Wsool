# Netlify's Next.js adapter, pinned so it always runs (without it Netlify
# serves the folder as a static site and every page is a 404).
[build]
  # Applies pending Prisma migrations to Supabase, then builds.
  command = "npm run build:deploy"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"

[[plugins]]
  package = "@netlify/plugin-nextjs"
